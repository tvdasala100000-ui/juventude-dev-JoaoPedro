<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="form-contato" action="action" method="post" >
    <center>
    <h1>Formulário Para Campeonato de Facada</h1>
    <label for="nome">Nome</label> <br>
    <input type="text" name="nome" 
    placeholder="Seu Nome" required> <br>
    <br>
    <label for="email">Email</label> <br>
    <input type="email" name="email" 
    placeholder="Seu@email.com" required > <br>
    <br>
    <label for="telefone">Telefone</label> <br>
<input 
    type="tel"
    placeholder="(00) 00000-0000"
    id="telefone"
    name="telefone"
    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
    title="Formato esperado: (00) 00000-0000"> <br>
    <br>
    <label for="cep"> CEP</label> <br>
    <input type="text"
    placeholder="Seu Cep" required
    id="cep"
    name="cep"
    pattern="[0-9]{5}-[0-9]{3}"
    title="Formato esperado:
    00000-000"> <br>
    <br>
    <label for="altura">Altura</label> <br>
    <input type="number" name="Altura"
    Placeholder="Sua Altura" required> <br>
    <br>
    <label for="idade">Idade</label> <br>
    <input type="number" name="idade"
    placeholder="Sua Idade" required > <br>
    <br>
    <label for="peso">Peso</label> <br>
    <input type="number" name="peso"
    placeholder="Seu Peso" required > <br>
    <br>
    <label for="data">Data</label> <br>
    <input type="date" name="nascimento"
     placeholder="Data de Dascimento" required> <br>
     <br>
    <label for="genero">Genêro</label> <br>

    <input type="radio" name="genero"
    value="f"> Feminino
    <br>
    <input type="radio" name="genero"
    value="m"> Masculino <br>
    <br>
    <label for="campo-nome"> Nome completo</label> <br>
    <input type="text"
    id="campo-nome" name="nome" required>
    <br>
    <label for="campo-aceite">Aceito os termos de uso</label>
    <input type="checkbox" id="campo-aceite" name="aceite"> <br>
    <br>
    <button type="submit">Enviar</button>

    </center>
    </form>
    
    <script>
        const formulario = document.querySelector("#form-contato");
        formulario.addEventListener("submit",
        function (event) {
            event.preventDefault();
            alert("Mensagem enviada com sucesso!");
        });
    </script>
</body>
</html>
