<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de navegação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="menu">
        <nav class="menu__nav" aria-label="Navegação principal">
            <a class="menu__logo" href="#inicio">Meu Site</a>

            <ul class="menu__links">
                <li><a class="btn btn-outline-light menu__botao" href="#inicio">Início</a></li>
                <li><a class="btn btn-outline-light menu__botao" href="#sobre">Sobre</a></li>
                <li><a class="btn btn-outline-light menu__botao" href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="conteudo">
        <div class="conteudo__grade">
            <section class="conteudo__principal" id="inicio">
                <h1>Bem-vindo ao meu site</h1>
            </section>

            <div class="conteudo__laterais">
                <section class="conteudo__quadrado" id="sobre">
                    <h2>Sobre</h2>
                </section>

                <section class="conteudo__quadrado" id="contato">
                    <h3>Contato</h3>
                </section>

                <section class="conteudo__quadrado" id="novidades">
                    <h4>Novidades</h4>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__brand">
                <h2>Meu Site</h2>
                <p>Projeto de estudos em desenvolvimento web.</p>
            </div>

            <nav class="footer__navigation" aria-label="Navegação do rodapé">
                <h3>Links</h3>
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>

        <div class="footer__copyright">
            <small>&copy; 2026 Meu Site. Todos os direitos reservados.</small>
        </div>
    </footer>
</body>
</html>
